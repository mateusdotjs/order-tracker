spring.application.name=api

# H2 em arquivo (persiste entre restarts)
spring.datasource.url=jdbc:h2:file:./data/orders
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Env
spring.config.import=optional:file:.env[.properties]

# JWT
app.jwt.secret=${JWT_SECRET:change-me-dev-secret-min-32-chars!!}
app.jwt.expiration-minutes=15
app.jwt.cookie-secure=${COOKIE_SECURE:false}